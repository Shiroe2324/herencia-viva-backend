services:
  backend:
    container_name: herencia-viva-backend
    restart: unless-stopped
    env_file: .env
    profiles: ['backend', 'only-backend']
    ports: ['${BACKEND_PORT}:${BACKEND_PORT}']
    networks: ['herencia-viva-network']
    build:
      context: .
      dockerfile: Dockerfile
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/health']
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      chroma:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: herencia-viva-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    profiles: ['database', 'backend', 'only-minio']
    ports: ['9000:9000', '9001:9001']
    volumes: ['herencia_viva_minio_data:/data']
    networks: ['herencia-viva-network']
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 5
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ['CMD', 'curl', '-I', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 5

  minio-setup:
    image: minio/mc:latest
    container_name: herencia-viva-minio-setup
    profiles: ['database', 'backend', 'only-minio']
    networks: ['herencia-viva-network']
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/${MINIO_BUCKET} &&
      mc anonymous set download local/${MINIO_BUCKET} &&
      exit 0
      "
    depends_on:
      minio:
        condition: service_healthy

  postgres:
    image: postgres:latest
    container_name: herencia-viva-postgres
    restart: unless-stopped
    command: postgres -c max_connections=200
    profiles: ['database', 'backend', 'only-postgres']
    ports: ['${DATABASE_PORT}:5432']
    volumes: ['herencia_viva_postgres_data:/var/lib/postgresql']
    networks: ['herencia-viva-network']
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 5
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:latest
    container_name: herencia-viva-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy noeviction
    profiles: ['database', 'backend', 'only-redis']
    ports: ['${REDIS_PORT}:6379']
    volumes: ['herencia_viva_redis_data:/data']
    networks: ['herencia-viva-network']
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 5
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a ${REDIS_PASSWORD} -h 127.0.0.1 PING']
      interval: 5s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: herencia-viva-pgadmin
    restart: unless-stopped
    profiles: ['dashboard', 'only-pgadmin']
    ports: ['15432:80']
    volumes: ['herencia_viva_pgadmin_data:/var/lib/pgadmin']
    networks: ['herencia-viva-network']
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 5
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  redisinsight:
    image: redis/redisinsight:latest
    container_name: herencia-viva-redisinsight
    restart: unless-stopped
    profiles: ['dashboard', 'only-redisinsight']
    ports: ['5540:5540']
    volumes: ['herencia_viva_redisinsight_data:/data']
    networks: ['herencia-viva-network']
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 5
    depends_on:
      redis:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: herencia-viva-cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN}
    restart: unless-stopped
    profiles: ['backend', 'only-cloudflared']
    networks: ['herencia-viva-network']
    depends_on:
      backend:
        condition: service_healthy

  chroma:
    image: chromadb/chroma:latest
    container_name: herencia-viva-chroma
    restart: unless-stopped
    profiles: ['database', 'backend', 'only-chroma']
    ports: ['${CHROMA_PORT}:8000']
    volumes: ['herencia_viva_chroma_data:/chroma']
    networks: ['herencia-viva-network']
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 5
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8000/api/v2/heartbeat']
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  herencia-viva-network:
    driver: bridge

volumes:
  herencia_viva_minio_data:
    driver: local
  herencia_viva_postgres_data:
    driver: local
  herencia_viva_redis_data:
    driver: local
  herencia_viva_pgadmin_data:
    driver: local
  herencia_viva_redisinsight_data:
    driver: local
  herencia_viva_chroma_data:
    driver: local
